<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="250" viewBox="0 0 1500 250" role="img" aria-labelledby="title desc">
  <title id="title">DataFrame action execution path</title>
  <desc id="desc">A DataFrame action passes through QueryExecution, Catalyst, the physical plan, SparkContext, DAGScheduler, TaskScheduler, scheduler backend, executors, and distributed results.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker>
    <style>.box{fill:#eff6ff;stroke:#2563eb;stroke-width:2;rx:10}.sched{fill:#f5f3ff;stroke:#7c3aed;stroke-width:2;rx:10}.exec{fill:#ecfdf5;stroke:#059669;stroke-width:2;rx:10}.t{font:600 17px Arial,sans-serif;fill:#0f172a;text-anchor:middle}.s{font:14px Arial,sans-serif;fill:#334155;text-anchor:middle}.line{stroke:#475569;stroke-width:2.2;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1500" height="250" fill="#ffffff"/>
  <text x="750" y="30" class="t" font-size="22">From DataFrame action to distributed execution</text>
  <g transform="translate(25 75)"><rect class="box" width="145" height="75"/><text class="t" x="72" y="32">DataFrame</text><text class="s" x="72" y="55">action</text></g>
  <line class="line" x1="170" y1="112" x2="198" y2="112"/>
  <g transform="translate(200 75)"><rect class="box" width="160" height="75"/><text class="t" x="80" y="30">QueryExecution</text><text class="s" x="80" y="54">on driver</text></g>
  <line class="line" x1="360" y1="112" x2="388" y2="112"/>
  <g transform="translate(390 75)"><rect class="box" width="170" height="75"/><text class="t" x="85" y="28">Catalyst</text><text class="s" x="85" y="51">analyze + optimize</text></g>
  <line class="line" x1="560" y1="112" x2="588" y2="112"/>
  <g transform="translate(590 75)"><rect class="box" width="150" height="75"/><text class="t" x="75" y="30">SparkPlan</text><text class="s" x="75" y="54">physical operators</text></g>
  <line class="line" x1="740" y1="112" x2="768" y2="112"/>
  <g transform="translate(770 75)"><rect class="sched" width="135" height="75"/><text class="t" x="67" y="30">SparkContext</text><text class="s" x="67" y="54">runJob</text></g>
  <line class="line" x1="905" y1="112" x2="933" y2="112"/>
  <g transform="translate(935 75)"><rect class="sched" width="135" height="75"/><text class="t" x="67" y="32">DAGScheduler</text></g>
  <line class="line" x1="1070" y1="112" x2="1098" y2="112"/>
  <g transform="translate(1100 75)"><rect class="sched" width="145" height="75"/><text class="t" x="72" y="32">TaskScheduler</text></g>
  <line class="line" x1="1245" y1="112" x2="1273" y2="112"/>
  <g transform="translate(1275 75)"><rect class="exec" width="190" height="75"/><text class="t" x="95" y="28">Executors</text><text class="s" x="95" y="51">task attempts + output</text></g>
  <text x="475" y="190" class="s">planning</text><text x="1005" y="190" class="s">scheduling</text><text x="1370" y="190" class="s">execution</text>
</svg>
