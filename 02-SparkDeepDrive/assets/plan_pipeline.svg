<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="410" viewBox="0 0 1250 410" role="img" aria-labelledby="title desc">
  <title id="title">Catalyst plan representations</title><desc id="desc">SQL and DataFrame inputs converge into analyzed and optimized logical plans, physical plan candidates, a selected SparkPlan, and an adaptive executed plan.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker><style>.i{fill:#f8fafc;stroke:#64748b;stroke-width:2;rx:10}.l{fill:#eff6ff;stroke:#2563eb;stroke-width:2;rx:10}.p{fill:#f5f3ff;stroke:#7c3aed;stroke-width:2;rx:10}.e{fill:#ecfdf5;stroke:#059669;stroke-width:2;rx:10}.t{font:600 17px Arial,sans-serif;fill:#0f172a;text-anchor:middle}.s{font:14px Arial,sans-serif;fill:#475569;text-anchor:middle}.a{stroke:#475569;stroke-width:2.3;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1250" height="410" fill="white"/><text x="625" y="31" class="t" font-size="24">A query passes through several plan representations</text>
  <g transform="translate(35 70)"><rect class="i" width="180" height="65"/><text class="t" x="90" y="39">SQL text</text></g><g transform="translate(35 245)"><rect class="i" width="180" height="65"/><text class="t" x="90" y="39">DataFrame API</text></g>
  <g transform="translate(270 70)"><rect class="l" width="210" height="65"/><text class="t" x="105" y="28">Parsed / unresolved</text><text class="s" x="105" y="50">logical plan</text></g><g transform="translate(270 245)"><rect class="l" width="210" height="65"/><text class="t" x="105" y="28">Unresolved</text><text class="s" x="105" y="50">logical plan</text></g>
  <path class="a" d="M215 102 L265 102"/><path class="a" d="M215 277 L265 277"/><path class="a" d="M480 102 C530 102,530 175,580 187"/><path class="a" d="M480 277 C530 277,530 210,580 198"/>
  <g transform="translate(585 155)"><rect class="l" width="210" height="70"/><text class="t" x="105" y="31">Analyzed</text><text class="s" x="105" y="54">logical plan</text></g><line class="a" x1="795" y1="190" x2="835" y2="190"/>
  <g transform="translate(840 155)"><rect class="l" width="210" height="70"/><text class="t" x="105" y="31">Optimized</text><text class="s" x="105" y="54">logical plan</text></g><path class="a" d="M945 225 L945 260"/>
  <g transform="translate(840 265)"><rect class="p" width="210" height="70"/><text class="t" x="105" y="29">Physical candidates</text><text class="s" x="105" y="53">choose SparkPlan</text></g><line class="a" x1="1050" y1="300" x2="1090" y2="300"/>
  <g transform="translate(1095 235)"><rect class="e" width="130" height="130"/><text class="t" x="65" y="30">Selected</text><text class="t" x="65" y="52">SparkPlan</text><text class="s" x="65" y="82">then adaptive</text><text class="s" x="65" y="103">executed plan</text></g>
</svg>
