<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-label="PySpark to Catalyst and JVM code generation">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#334155"/></marker><style>.h{font:700 27px Arial;fill:#0f172a}.t{font:700 17px Arial;fill:#0f172a}.s{font:14px Arial;fill:#334155}.b{rx:13;stroke-width:2}.a{stroke:#334155;stroke-width:2.4;marker-end:url(#a)}</style></defs>
<rect width="1200" height="430" fill="#f8fafc"/><text x="600" y="44" text-anchor="middle" class="h">PySpark does not translate Python into Scala source</text>
<rect x="25" y="120" width="185" height="95" class="b" fill="#dbeafe" stroke="#2563eb"/><text x="118" y="153" text-anchor="middle" class="t">Python process</text><text x="118" y="179" text-anchor="middle" class="s">DataFrame + Column</text><text x="118" y="201" text-anchor="middle" class="s">lazy expressions</text><line x1="210" y1="168" x2="280" y2="168" class="a"/><text x="245" y="148" text-anchor="middle" class="s">Py4J / Connect</text>
<rect x="285" y="120" width="195" height="95" class="b" fill="#ede9fe" stroke="#7c3aed"/><text x="383" y="153" text-anchor="middle" class="t">Catalyst trees</text><text x="383" y="179" text-anchor="middle" class="s">JVM objects</text><text x="383" y="201" text-anchor="middle" class="s">largely Scala internals</text><line x1="480" y1="168" x2="540" y2="168" class="a"/>
<rect x="545" y="120" width="190" height="95" class="b" fill="#dcfce7" stroke="#16a34a"/><text x="640" y="153" text-anchor="middle" class="t">Optimized plan</text><text x="640" y="179" text-anchor="middle" class="s">resolved expressions</text><text x="640" y="201" text-anchor="middle" class="s">physical operators</text><line x1="735" y1="168" x2="795" y2="168" class="a"/>
<rect x="800" y="120" width="170" height="95" class="b" fill="#fef3c7" stroke="#d97706"/><text x="885" y="153" text-anchor="middle" class="t">Java source</text><text x="885" y="179" text-anchor="middle" class="s">whole-stage fusion</text><text x="885" y="201" text-anchor="middle" class="s">supported operators</text><line x1="970" y1="168" x2="1025" y2="168" class="a"/>
<rect x="1030" y="120" width="140" height="95" class="b" fill="#fee2e2" stroke="#dc2626"/><text x="1100" y="157" text-anchor="middle" class="t">JVM bytecode</text><text x="1100" y="187" text-anchor="middle" class="s">execution</text>
<rect x="260" y="290" width="680" height="78" class="b" fill="#fff" stroke="#64748b" stroke-dasharray="7 5"/><text x="600" y="321" text-anchor="middle" class="t">Python UDF exception</text><text x="600" y="348" text-anchor="middle" class="s">Logic runs in Python workers and crosses a serialization boundary; Catalyst cannot inspect its internals.</text><path d="M118 215c0 110 85 115 142 115" fill="none" stroke="#334155" stroke-width="2.4" stroke-dasharray="7 5" marker-end="url(#a)"/>
</svg>
