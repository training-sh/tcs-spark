<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-label="Modern Spark SQL planning lifecycle">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#334155"/></marker><style>.h{font:700 27px Arial;fill:#0f172a}.t{font:600 16px Arial;fill:#0f172a}.s{font:14px Arial;fill:#334155}.b{rx:13;stroke-width:2}.a{stroke:#334155;stroke-width:2.4;marker-end:url(#a)}</style></defs>
<rect width="1200" height="470" fill="#f8fafc"/><text x="600" y="42" text-anchor="middle" class="h">Spark SQL: plan first, execute later</text>
<rect x="25" y="95" width="145" height="65" class="b" fill="#dbeafe" stroke="#2563eb"/><text x="98" y="123" text-anchor="middle" class="t">SQL text</text><text x="98" y="146" text-anchor="middle" class="s">parser</text>
<rect x="25" y="225" width="145" height="65" class="b" fill="#dbeafe" stroke="#2563eb"/><text x="98" y="253" text-anchor="middle" class="t">DataFrame API</text><text x="98" y="276" text-anchor="middle" class="s">logical operators</text>
<line x1="170" y1="128" x2="220" y2="185" class="a"/><line x1="170" y1="258" x2="220" y2="207" class="a"/>
<rect x="225" y="155" width="165" height="82" class="b" fill="#ede9fe" stroke="#7c3aed"/><text x="308" y="187" text-anchor="middle" class="t">Unresolved plan</text><text x="308" y="213" text-anchor="middle" class="s">names not bound</text><line x1="390" y1="196" x2="430" y2="196" class="a"/>
<rect x="435" y="155" width="165" height="82" class="b" fill="#fef3c7" stroke="#d97706"/><text x="518" y="187" text-anchor="middle" class="t">Analysis</text><text x="518" y="213" text-anchor="middle" class="s">catalog • schema • types</text><line x1="600" y1="196" x2="640" y2="196" class="a"/>
<rect x="645" y="155" width="190" height="82" class="b" fill="#dcfce7" stroke="#16a34a"/><text x="740" y="187" text-anchor="middle" class="t">Logical optimization</text><text x="740" y="213" text-anchor="middle" class="s">rules • CBO estimates</text><line x1="835" y1="196" x2="875" y2="196" class="a"/>
<rect x="880" y="155" width="210" height="82" class="b" fill="#fee2e2" stroke="#dc2626"/><text x="985" y="187" text-anchor="middle" class="t">Physical planning</text><text x="985" y="213" text-anchor="middle" class="s">joins • scans • exchanges</text>
<line x1="985" y1="237" x2="985" y2="290" class="a"/><rect x="835" y="295" width="255" height="75" class="b" fill="#cffafe" stroke="#0891b2"/><text x="963" y="325" text-anchor="middle" class="t">JVM execution</text><text x="963" y="350" text-anchor="middle" class="s">tasks • shuffle statistics</text>
<line x1="835" y1="333" x2="750" y2="333" class="a"/><rect x="490" y="295" width="255" height="75" class="b" fill="#fce7f3" stroke="#db2777"/><text x="618" y="325" text-anchor="middle" class="t">AQE at runtime</text><text x="618" y="350" text-anchor="middle" class="s">coalesce • joins • skew</text><path d="M618 295c0-35 175-40 262-80" fill="none" stroke="#db2777" stroke-width="2.4" stroke-dasharray="7 5" marker-end="url(#a)"/>
<text x="600" y="430" text-anchor="middle" class="s">CBO uses catalog estimates before execution; AQE uses observed shuffle statistics during execution.</text>
</svg>
